# 蓝环境（旧版本 / stable）
# 标签设计是全部实验的基础：app=web 决定"属于同一个应用"，version 决定"属于哪个版本"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: release-lab
  labels:
    app: web
    version: blue
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web
        version: blue
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=BLUE v1.0 (stable)"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
